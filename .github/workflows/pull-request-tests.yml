# Runs the unit tests and the typecheck on every pull request, so a failure shows before the merge.
# The database and Swift suites are not here: seeding the test database needs a USDA key and the
# network, and the Swift tests need a macOS runner.
name: pull-request-tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pull-request-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
